<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
Personal Expense Tracker | Page 4 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Personal Expense Tracker</title>
 <link rel="stylesheet" href="style.css">
</head>
<section class="cards" aria-label="Summary">
 <article class="card balance">
 <h3>Balance</h3>
 <p id="balance"> 0.00</p> ₹
 </article>
 <article class="card income">
 <h3>Total Income</h3>
 <p id="totalIncome"> 0.00</p> ₹
 </article>
 <article class="card expense">
 <h3>Total Expense</h3>
 <p id="totalExpense"> 0.00</p> ₹
 </article>
 <article class="card budget">
 <h3>Monthly Budget</h3>
 <div class="budget-row">
 <input type="number" id="budgetInput" min="0" placeholder="Set budget">
 <button id="saveBudget" class="btn small">Save</button>
 </div>
 <div class="progress"><div id="budgetBar"></div></div>
 <small id="budgetText">No budget set</small>
 </article>
 </section>
<form id="txForm" novalidate>
 <input type="hidden" id="editId">
 <label for="title">Title</label>
 <input type="text" id="title" placeholder="e.g. Grocery shopping" maxlength="40">
 <span class="error" id="titleErr"></span>
 <label for="amount">Amount ( )</label> ₹
 <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">
 <span class="error" id="amountErr"></span>
 <div class="two">
 <div>
 <label for="type">Type</label>
 <select id="type">
 <option value="expense">Expense</option>
 <option value="income">Income</option>
 </select>
 </div>
 <div>
 <label for="category">Category</label>
 <select id="category"></select>
 </div>
 </div>
 <label for="date">Date</label>
 <input type="date" id="date">
 <span class="error" id="dateErr"></span>
Personal Expense Tracker | Page 5 <div class="form-actions">
 <button type="submit" id="submitBtn" class="btn primary">Add 
Transaction</button>
 <button type="button" id="cancelEdit" class="btn ghost hidden">Cancel</button>
 </div>
 </form>
<canvas id="chart" width="320" height="320"></canvas>
<div class="table-wrap">
 <table>
 <thead>
 <tr><th>Date</th><th>Title</th><th>Category</th><th>Type</th><th 
class="r">Amount</th><th class="r">Actions</th></tr>
 </thead>
 <tbody id="txBody"></tbody>
 </table>
</div>
